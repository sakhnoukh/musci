[build-system]
requires = ["setuptools>=68.0,<81.0", "wheel>=0.40,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musci"
version = "0.1.0"
description = "Bulk Spotify, Apple Music & YouTube playlist 320kbps MP3 downloader and DJ BPM/Camelot key analyzer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.15"
keywords = ["dj", "music", "mp3", "bpm", "camelot", "spotify", "apple-music", "playlist"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "yt-dlp>=2025.1.1,<2027.0.0",
    "yt-dlp-ejs>=0.3.0,<1.0.0",
    "librosa>=0.10.2,<0.12.0",
    "numpy>=1.26.0,<3.0.0",
    "soundfile>=0.12.1,<0.14.0",
    "mutagen>=1.47.0,<1.49.0",
    "httpx>=0.27.0,<0.29.0",
    "typer>=0.12.0,<0.22.0",
    "rich>=13.7.0,<15.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[project.urls]
Homepage = "https://github.com/sakhnoukh/musci"
Repository = "https://github.com/sakhnoukh/musci"

[project.scripts]
musci = "musci.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
